<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO requirements for Task 1 -->
    <title>Interest Rate Calculator</title>
    <meta name="description" content="A simple and accurate interest rate calculator to compute simple interest over time.">
    
    <!-- Favicon and CSS requirements for Task 1 -->
    <link rel="icon" type="image/x-icon" href="https://www.favicon.cc/logo3d/59039.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <!-- H1 requirement for Task 1 -->
        <h1>Interest Rate Calculator</h1>
        
        <div class="form-group">
            <label for="principal">Principal Amount ($):</label>
            <input type="number" id="principal" placeholder="Enter principal amount">
        </div>
        
        <div class="form-group">
            <label for="rate">Interest Rate (%):</label>
            <input type="number" id="rate" placeholder="Enter annual interest rate">
        </div>
        
        <div class="form-group">
            <label for="time">Time (Years):</label>
            <input type="number" id="time" placeholder="Enter time in years">
        </div>
        
        <button id="calculateBtn">Calculate Interest</button>
        
        <div class="result" id="result"></div>
    </div>

    <!-- JS reference requirement for Task 1 -->
    <script src="script.js"></script>
</body>
</html>
